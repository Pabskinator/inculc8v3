        d="M30 10 L70 10 L90 30 L90 70 L70 90 L30 90 L10 70 L10 30 L30 10 Z" 
        stroke="#22c55e" 
        stroke-width="8"
    />
    
    <!-- Inner Pillar (The 'I') -->
